name: ci

on:
  push:
    branches: [main, "feature/*"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff pytest
      - name: Ruff lint
        run: ruff check .
      - name: Pytest (fast + seed sweep)
        run: python -m pytest -q
